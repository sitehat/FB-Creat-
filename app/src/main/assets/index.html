    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script>
        let profileModal;

        document.addEventListener("DOMContentLoaded", function() {
            profileModal = new bootstrap.Modal(document.getElementById('profileModal'));
            getOrGenerateRegId();
        });

        // ব্রাউজারের লোকাল স্টোরেজে ইউনিক আইডি তৈরি ও সেভ করার ফাংশন (যা কখনো মুছবে না)
        function getOrGenerateRegId() {
            let regId = localStorage.getItem('fb_creat_reg_id');
            if (!regId) {
                const randomHex = Math.random().toString(36).substring(2, 8).toUpperCase();
                regId = "FBC-" + randomHex;
                localStorage.setItem('fb_creat_reg_id', regId);
            }
            document.getElementById('modalRegId').value = regId;
            return regId;
        }

        function openProfileModal() {
            getOrGenerateRegId();
            profileModal.show();
        }

        function copyRegId() {
            const regId = document.getElementById('modalRegId').value;
            navigator.clipboard.writeText(regId).then(function() {
                alert("Registration ID Copied: " + regId);
            }, function(err) {
                // ফলব্যাক কপি মেথড
                const textBox = document.getElementById('modalRegId');
                textBox.select();
                document.execCommand('copy');
                alert("Registration ID Copied: " + regId);
            });
        }

        function handleNewFbAccount() {
            if (window.AndroidBridge) {
                window.AndroidBridge.openFbLite();
            } else {
                // সরাসরি ব্রাউজার বা ফেসবুক ওপেন করার বিকল্প
                window.location.href = "https://m.facebook.com/";
            }
        }
    </script>
